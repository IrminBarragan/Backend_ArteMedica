spring.application.name=artemedica-farmacia

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/artemedica_farmacia_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seed de datos (data.sql) despues de que Hibernate actualice el esquema
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=${JWT_SECRET:cambia-este-valor-por-uno-largo-y-aleatorio-solo-para-desarrollo-local}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
