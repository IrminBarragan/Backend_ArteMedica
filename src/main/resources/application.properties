spring.application.name=artemedica-farmacia

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/artemedica_farmacia_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA. El esquema lo gestiona Flyway, no Hibernate: validate solo comprueba que las
# entidades coincidan con las tablas y falla el arranque si divergen, sin alterar nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Migraciones versionadas en db/migration. baseline-on-migrate permite adoptar Flyway sobre
# una base que ya tenia tablas creadas por el ddl-auto=update anterior.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:cambia-este-valor-por-uno-largo-y-aleatorio-solo-para-desarrollo-local}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: origenes permitidos para el frontend, separados por coma.
# Ej: CORS_ALLOWED_ORIGINS=http://localhost:5173,https://farmacia.artemedica.mx
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seed inicial (DataSeeder). El admin se crea siempre que no exista; los datos demo solo en desarrollo.
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin12345}
app.seed.demo.enabled=${SEED_DEMO_ENABLED:true}

# Actuator: solo health e info quedan expuestos. /actuator/health es publico (lo consultan
# Docker/Kubernetes sin token); el detalle completo (ej. estado de la conexion a BD) solo se
# muestra a un cliente autenticado, para no filtrar informacion interna a un caller anonimo.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
