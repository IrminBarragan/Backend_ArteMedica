spring.application.name=artemedica-farmacia

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/artemedica_farmacia_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:cambia-este-valor-por-uno-largo-y-aleatorio-solo-para-desarrollo-local}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: origenes permitidos para el frontend, separados por coma.
# Ej: CORS_ALLOWED_ORIGINS=http://localhost:5173,https://farmacia.artemedica.mx
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seed inicial (DataSeeder). El admin se crea siempre que no exista; los datos demo solo en desarrollo.
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin12345}
app.seed.demo.enabled=${SEED_DEMO_ENABLED:true}
